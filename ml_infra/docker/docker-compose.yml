services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.8"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_DIR=/app/data/images
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - ORT_INTRA_OP_NUM_THREADS=2
      - MALLOC_ARENA_MAX=2
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs
